                    email: cliente@example.com
                    name: Cliente Ficticio
                    phone: '11900000000'
                    role: customer
                  summary: Resposta ilustrativa
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                ErroDeValidacao:
                  value:
                    code: validation_error
                    detail: Revise os campos informados.
                    errors:
                      quantity_delta:
                      - Informe um inteiro JSON.
                  summary: Erro de validacao
          description: Entrada ou parametros invalidos; errors identifica campos.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Token ausente, expirado ou invalido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Perfil sem permissao para a operacao.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Registro inexistente ou fora da visibilidade do usuario; pagina
            inexistente.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Metodo nao permitido.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                ConflitoDeEstado:
                  value:
                    code: invalid_transition
                    detail: Transicao nao permitida.
                    errors: null
                  summary: Conflito de estado
          description: Conflito de estado, saldo, SKU ou integridade; nenhuma alteracao
            parcial.
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: API aceita apenas application/json no corpo.
        '429':
          content:
            application/json:
              schema:

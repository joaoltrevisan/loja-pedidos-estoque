  /api/orders/:
    get:
      operationId: orders_list
      description: 'Perfil autorizado: cliente (proprios) ou administrador (todos).
        status e exato; customer_id exclusivo de administradores. created_from inclusivo
        e created_before exclusivo (ISO 8601, fuso America/Sao_Paulo quando omitido).
        ordering: id, created_at, total, status. Pagina padrao 20; maximo 100.'
      summary: Listar pedidos visiveis
      parameters:
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - in: query
        name: created_from
        schema:
          type: string
          format: date-time
      - in: query
        name: customer_id
        schema:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
      - in: query
        name: ordering
        schema:
          type: string
          minLength: 1
          default: id
          maxLength: 100
      - in: query
        name: page
        schema:
          type: integer
          maximum: 1000000
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: status
        schema:
          enum:
          - PENDING_PAYMENT
          - PAID
          - SHIPPED
          - DELIVERED
          - CANCELLED
          type: string
          minLength: 1
        description: |-
          * `PENDING_PAYMENT` - Aguardando pagamento
          * `PAID` - Pago (simulado)
          * `SHIPPED` - Enviado
          * `DELIVERED` - Entregue
          * `CANCELLED` - Cancelado
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderDetailList'
              examples:
                RespostaIlustrativa:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - id: 1
                      customer_id: 1
                      status: PENDING_PAYMENT
                      currency: BRL
                      total: '11.80'
                      shipping_address:
                        recipient: Cliente Ficticio
                        street: Rua Imaginaria
                        number: '123'
                        district: Bairro Modelo
                        city: Sao Paulo
                        state: SP
                        postal_code: '01001000'
                        complement: ''
                        country: BR
                      items:
                      - product_id: 1
                        product_sku: DEMO-PEN-001
                        product_name: Caneta Ficticia
                        quantity: 2
                        unit_price: '5.90'
                        subtotal: '11.80'
                      created_at: '2026-01-15T10:00:00-03:00'
                      updated_at: '2026-01-15T10:00:00-03:00'
                      paid_at: null
                      cancelled_at: null
                      shipped_at: null
                      delivered_at: null
                      payment_mode: SIMULATED_NO_REAL_CHARGE
                      simulated_payment: null
                      shipment: null
                  summary: Resposta ilustrativa
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                ErroDeValidacao:
                  value:
                    code: validation_error
                    detail: Revise os campos informados.
                    errors:
                      quantity_delta:
                      - Informe um inteiro JSON.
                  summary: Erro de validacao
          description: Entrada ou parametros invalidos; errors identifica campos.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Token ausente, expirado ou invalido.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Perfil sem permissao para a operacao.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Registro inexistente ou fora da visibilidade do usuario; pagina
            inexistente.
        '405':

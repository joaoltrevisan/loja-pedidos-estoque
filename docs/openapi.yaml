openapi: 3.0.3
info:
  title: Loja ficticia — pedidos e estoque
  version: 0.8.0
  description: API de portfolio. Dados ficticios; pagamentos SIMULADOS, SEM COBRANCA
    REAL. Relatorios exclusivos do administrador. Use login, copie access e clique
    Authorize (Bearer).
